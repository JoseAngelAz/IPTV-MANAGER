{% extends 'base.html' %}
{% block title %} — Editar Nota{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Editar Nota</h2>
<div class="max-w-lg bg-white p-6 rounded shadow">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">Contenido</label>
            <textarea name="contenido" rows="4" class="w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-white" required>{{ nota.contenido }}</textarea>
        </div>
        <div class="mt-4 flex space-x-3">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Guardar</button>
            <a href="{% url 'cliente_detail' nota.cliente.pk %}" class="px-4 py-2 border rounded hover:bg-gray-100">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
