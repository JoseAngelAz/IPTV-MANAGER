{% extends 'base.html' %}
{% block title %} — Desactivar Cliente{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow text-center">
    <h2 class="text-xl font-bold mb-4">¿Desactivar cliente?</h2>
    <p class="mb-4">{{ cliente.nombre }} — {{ cliente.dispositivo_id }}</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center space-x-3">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Sí, desactivar</button>
            <a href="{% url 'cliente_detail' cliente.pk %}" class="px-4 py-2 border rounded hover:bg-gray-100">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
