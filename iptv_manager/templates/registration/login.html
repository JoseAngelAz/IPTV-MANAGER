{% extends 'base.html' %}
{% block title %} — {{ tr.iniciar_sesion }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white dark:bg-gray-800 p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">{{ tr.iniciar_sesion_title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">{{ tr.usuario }}</label>
            <input type="text" name="username" class="w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-white" required>
        </div>
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">{{ tr.contraseña }}</label>
            <input type="password" name="password" class="w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-white" required>
        </div>
        {% if form.errors %}
        <p class="text-red-500 text-sm mb-2">{{ tr.credenciales_incorrectas }}</p>
        {% endif %}
        <button type="submit" class="w-full mt-4 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">{{ tr.entrar }}</button>
    </form>
</div>
{% endblock %}
