# fly.toml app configuration file generated for iptv-manager-unfurling-hillside-7357 on 2026-06-08T17:44:53-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'iptv-manager-unfurling-hillside-7357'
primary_region = 'iad'
console_command = '/app/manage.py shell'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = 'media'
  destination = '/app/media'

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'
